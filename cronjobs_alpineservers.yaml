---
# Alpine runs its maintenance from /etc/periodic via root's crontab.
# On vaultwarden the daily run includes the backup, so the time matters:
# 00:30 local time, before the Proxmox backup and the Sunday updates.
# Without tzdata Alpine uses UTC, which would shift that by one or two hours.
- hosts: alpineservers
  gather_facts: false
  become: true
  name: "Timezone and periodic jobs on the Alpine servers"
  tasks:
    - name: "Install tzdata"
      community.general.apk:
        name: tzdata

    - name: "Set the timezone"
      ansible.builtin.copy:
        src: "/usr/share/zoneinfo/{{ timezone }}"
        dest: /etc/localtime
        remote_src: true
        mode: "0644"
      notify: Restart crond

    - name: "Write /etc/timezone"
      ansible.builtin.copy:
        dest: /etc/timezone
        content: "{{ timezone }}\n"
        mode: "0644"
      notify: Restart crond

    - name: "Run /etc/periodic/daily at {{ periodic_daily_time }}"
      ansible.builtin.lineinfile:
        path: /etc/crontabs/root
        regexp: '^\S+\s+\S+\s+\*\s+\*\s+\*\s+run-parts /etc/periodic/daily$'
        line: "{{ periodic_daily_time.split(':')[1] | int }}\t{{ periodic_daily_time.split(':')[0] | int }}\t*\t*\t*\trun-parts /etc/periodic/daily"
      notify: Restart crond

  handlers:
    - name: Restart crond
      ansible.builtin.service:
        name: crond
        state: restarted
