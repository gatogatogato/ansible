---
# Pull the current state of the flickr-uploader repo with flickr-uploader-deploy.
# The script is installed first, so a changed template applies right away.
# See docs/flickr-uploader.md.
- hosts: flickr
  gather_facts: false
  become: true
  name: "flickr uploader: deploy"
  tasks:
    - name: "Install flickr-uploader-deploy"
      ansible.builtin.template:
        src: templates/flickr-uploader-deploy.sh.j2
        dest: /usr/local/bin/flickr-uploader-deploy
        owner: root
        group: root
        mode: "0755"

    - name: "Deploy with flickr-uploader-deploy"
      ansible.builtin.command: /usr/local/bin/flickr-uploader-deploy
      become_user: gato
      register: deploy
      changed_when: "'Server already up to date' not in deploy.stdout"
      failed_when: false

    - name: "Show the deploy output"
      ansible.builtin.debug:
        var: deploy.stdout_lines

    - name: "Stop if the deploy failed"
      ansible.builtin.fail:
        msg: "{{ deploy.stderr }}"
      when: deploy.rc != 0
