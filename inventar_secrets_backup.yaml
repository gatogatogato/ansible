---
# Copy debian-inventar's secrets file to debian-ansible, so a rebuilt
# debian-inventar gets it back with run.sh inventar-setup. Run again after
# a credential changed. See docs/inventar.md.
- hosts: inventar
  gather_facts: no
  become: yes
  name: "inventar: back up secrets to debian-ansible"
  tasks:
    - name: "Create the backup folder on debian-ansible"
      ansible.builtin.file:
        path: "{{ inventar_secrets_backup | dirname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: no

    - name: "Fetch the secrets"
      ansible.builtin.fetch:
        src: "{{ inventar_secrets }}"
        dest: "{{ inventar_secrets_backup }}"
        flat: yes
        fail_on_missing: yes

    - name: "Make the copy readable only by transport"
      ansible.builtin.file:
        path: "{{ inventar_secrets_backup }}"
        mode: "0600"
      delegate_to: localhost
      become: no
