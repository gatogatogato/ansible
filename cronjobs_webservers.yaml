---
- hosts: websrv
  gather_facts: true
  become: true
  name: "Create cronjobs on webservers"
  tasks:
    - name: "Log folder for gato's cronjobs"
      ansible.builtin.file:
        path: /home/gato/logs
        state: directory
        owner: gato
        group: gato
        mode: "0755"

    # deploy.sh --if-changed does nothing unless GitHub has new commits,
    # so the log only grows when something was deployed or failed
    - name: "gato cronjob to deploy the website after a push"
      ansible.builtin.cron:
        user: gato
        name: "website deploy"
        minute: "*/5"
        job: test -x {{ website_dir }}/deploy.sh && {{ website_dir }}/deploy.sh --if-changed >> /home/gato/logs/website-deploy.log 2>&1

    - name: "logrotate for gato's logs"
      ansible.builtin.apt:
        name: logrotate

    # Monthly rotation, 3 old months kept, so nothing is older than about 90 days
    - name: "Rotate gato's logs monthly, delete after 3 months"
      ansible.builtin.copy:
        dest: /etc/logrotate.d/gato-logs
        owner: root
        group: root
        mode: "0644"
        content: |
          /home/gato/logs/*.log {
              su gato gato
              monthly
              rotate 3
              compress
              delaycompress
              missingok
              notifempty
          }

    # The source is in GitHub now, the daily tarballs are no longer needed
    - name: "Remove the old gato cronjob for backups"
      ansible.builtin.cron:
        user: gato
        name: "backups"
        state: absent

    - name: "Remove the old gato cronjob for cleanup of backups"
      ansible.builtin.cron:
        user: gato
        name: "cleanup of backups"
        state: absent

    # HTTPS is done by the Cloudflare Tunnel, no certificate on websrv
    - name: "Remove the old root cronjob for certbot renew"
      ansible.builtin.cron:
        user: root
        name: "certbot renew"
        state: absent
