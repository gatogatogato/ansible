---
- hosts: websrv
  gather_facts: yes
  become: yes
  name: "Create cronjobs on webservers"
  tasks:
    - name: "Log folder for gato's cronjobs"
      ansible.builtin.file:
        path: /home/gato/logs
        state: directory
        owner: gato
        group: gato
        mode: "0755"

    # deploy.sh --if-changed does nothing unless GitHub has new commits,
    # so the log only grows when something was deployed or failed
    - name: "gato cronjob to deploy the website after a push"
      ansible.builtin.cron:
        user: gato
        name: "website deploy"
        minute: "*/5"
        job: test -x {{ website_dir }}/deploy.sh && {{ website_dir }}/deploy.sh --if-changed >> /home/gato/logs/website-deploy.log 2>&1

    # The source is in GitHub now, the daily tarballs are no longer needed
    - name: "Remove the old gato cronjob for backups"
      ansible.builtin.cron:
        user: gato
        name: "backups"
        state: absent

    - name: "Remove the old gato cronjob for cleanup of backups"
      ansible.builtin.cron:
        user: gato
        name: "cleanup of backups"
        state: absent

    - name: "root cronjob for certbot renew"
      ansible.builtin.cron:
        user: root
        name: "certbot renew"
        special_time: weekly
        job: certbot renew --quiet
