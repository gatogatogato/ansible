---
# Delete the PRIVATE transport key from every host except the ansible server.
# It only belongs on debian-ansible; a copy elsewhere lets whoever breaks into
# that host reach all others. Check first with run.sh audit-key.
# Hosts whose cron jobs use ssh/scp/rsync keep the key (e.g. camsnaps copies
# snapshots from Home Assistant with it). To undo on one host, copy
# /home/transport/.ssh/id_ed25519 back from debian-ansible.
#   run.sh remove-key
- import_playbook: find_reachable.yaml
  vars:
    target_group: all

- hosts: "reachable_all:!ansible"
  gather_facts: no
  become: yes
  name: "Remove the private transport key outside the ansible server"
  tasks:
    - name: "Check whether cron jobs need the key"
      ansible.builtin.shell: >-
        grep -lsE '(^|[^a-z])(ssh|scp|rsync|sftp)([^a-z]|$)'
        /var/spool/cron/crontabs/* /var/spool/cron/* /etc/crontab /etc/cron.d/* 2>/dev/null || true
      register: cron_ssh
      changed_when: false

    - name: "Delete the private key"
      ansible.builtin.file:
        path: /home/transport/.ssh/id_ed25519
        state: absent
      when: cron_ssh.stdout | length == 0

    - name: "Keep it where cron uses ssh"
      ansible.builtin.debug:
        msg: "Kept the key on {{ inventory_hostname }}, used by: {{ cron_ssh.stdout_lines | join(', ') }}"
      # changed, so the compact output shows it
      changed_when: true
      when: cron_ssh.stdout | length > 0
