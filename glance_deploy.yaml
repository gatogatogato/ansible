---
# Deploy the current state of the glance repo with glance-deploy (pull, backup,
# copy glance.yml and assets/, restart Glance). The script is installed first,
# so a changed template applies right away. See docs/glance.md.
- hosts: glance
  gather_facts: no
  become: yes
  name: "Glance: deploy the config"
  tasks:
    - name: "Install glance-deploy"
      ansible.builtin.template:
        src: templates/glance-deploy.sh.j2
        dest: /usr/local/sbin/glance-deploy
        owner: root
        group: root
        mode: "0755"

    - name: "Deploy with glance-deploy"
      ansible.builtin.command: /usr/local/sbin/glance-deploy
      register: deploy
      changed_when: "'Server already up to date' not in deploy.stdout"
      failed_when: false

    - name: "Show the deploy output"
      ansible.builtin.debug:
        var: deploy.stdout_lines

    - name: "Stop if the deploy failed"
      ansible.builtin.fail:
        msg: "{{ deploy.stderr }}"
      when: deploy.rc != 0
