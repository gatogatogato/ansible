---
all:
  vars:
    ansible_user: transport
    ansible_python_interpreter: auto_silent
    ansible_ssh_private_key_file: ~transport/.ssh/id_ed25519
    # IPv4 only, so hosts always see the ansible server as 192.168.1.133 (see harden_transport_ssh.yaml)
    ansible_ssh_common_args: "-4"
    # The only addresses the transport key is accepted from (from= in authorized_keys):
    # the ansible server, plus loopback because it also manages itself.
    # To move the server to a new IP: add it here, run.sh harden-ssh, move, then remove the old one.
    controller_ips:
      - 192.168.1.133
      - 127.0.0.1
      - ::1
    # Public SSH keys that may log in as gato (newserver_setup_basics.yaml)
    gato_ssh_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJaUGEqwGh5OuDA7ohKWQrLQIM+c8ZOlBFgVrk2b+UXT gato ecdsa25519 2020-09-15

proxmoxservers:
  hosts:
    proxmox-n01:
      ansible_host: proxmox-n01.lan
    proxmox-n02:
      ansible_host: proxmox-n02.lan
    proxmox-n03:
      ansible_host: proxmox-n03.lan
  vars:
    # Kuma reminder (run.sh updates-proxmox-check, docs/proxmox-updates.md):
    # red when updates wait and the last apt upgrade is older than this
    proxmox_update_max_days: 30
    # Host configuration backup (run.sh hostconfig-backup, docs/proxmox-hostconfig.md)
    hostconfig_local_dir: /home/transport/backups/proxmox-hostconfig
    # Storage NAS-SMB = TrueNAS share proxmox-raw-backups, uploaded to Storj by TrueCloud
    hostconfig_nas_mount: /mnt/pve/NAS-SMB
    hostconfig_nas_subdir: hostconfig
    hostconfig_keep: 8
    # Relative to /, missing ones are skipped
    hostconfig_paths:
      - etc/pve
      - etc/network
      - etc/hosts
      - etc/hostname
      - etc/resolv.conf
      - etc/fstab
      - etc/crontab
      - etc/cron.d
      - var/spool/cron/crontabs
      - root/.ssh
      - etc/ssh
      - home/transport/.ssh
      - etc/sudoers.d
      - etc/apt
      - etc/modules
      - etc/modprobe.d
      - etc/default/grub
      - etc/kernel/cmdline
      - etc/sysctl.conf
      - etc/sysctl.d
      - etc/udev/rules.d
      - etc/systemd/network
      - etc/systemd/system
      - etc/vzdump.conf
      - etc/lvm/lvm.conf
      - etc/postfix/main.cf
      - etc/timezone

debianservers:
  hosts:
    uptimekuma:
      ansible_host: debian-uptimekuma.lan
    websrv:
      # static IP 192.168.1.81 (set in the container, DNS in Pi-hole), Cloudflare Tunnel points there
      ansible_host: debian-websrv.lan
      # Hugo source of gatogatogato.ch (private repo, read via deploy key, see docs/webseite.md).
      # SSH over port 443, because not every github.com address answers on port 22 from here.
      website_repo: ssh://git@ssh.github.com:443/gatogatogato/gatogatogato.ch-hugo.git
      website_dir: /home/gato/gatogatogato.ch-hugo
      # Apache serves the site from here, deploy.sh syncs Hugo's public/ into it
      website_docroot: /var/www/html/gatogatogato.ch
      # Apache virtual host (website_apache.yaml)
      website_domain: gatogatogato.ch
      website_vhost_file: 001-gatogatogato.conf
      # HTTPS on websrv itself (certbot); false when Cloudflare Tunnel does HTTPS.
      # false since 2026-09: the tunnel serves HTTPS and reaches websrv via http://192.168.1.81
      website_https_wanted: false
    flickr:
      ansible_host: debian-flickr.lan
      # Everything the flickr server runs, and how to rebuild it: docs/flickr-server.md.
      # Private repos, read via deploy keys, SSH over port 443 like the website repo.
      uploader_repo: ssh://git@ssh.github.com:443/gatogatogato/flickr-uploader.git
      uploader_dir: /home/gato/Apps/flickr-uploader
      commenter_repo: ssh://git@ssh.github.com:443/gatogatogato/flickr-scripts.git
      commenter_dir: /home/gato/Apps/flickr-scripts
      commenter_script: flickr-commenter-v9.2.rb
      # Where the setup playbooks move the old hand-made copies (with keys in the code)
      flickr_old_dir: /home/gato/Apps/alt
      # Copy of the secrets on debian-ansible (run.sh flickr-secrets-backup), never in git
      flickr_secrets_dir: /home/transport/.config/flickr-secrets
      flickr_secrets:
        - { name: uploader-credentials.yml, dest: /home/gato/.config/flickr-uploader/credentials.yml, what: "flickr, Mastodon, Pushover for the uploader" }
        - { name: flickr-credentials.yml, dest: /home/gato/.config/flickr-scripts/flickr-credentials.yml, what: "flickr, Pushover for the commenter" }
        - { name: netrc, dest: /home/gato/.netrc, what: "Nextcloud login for the UPLOADS sync" }
    ansible:
      ansible_host: debian-ansible.lan
    hercules:
      ansible_host: debian-hercules.lan
    # Two Pi-holes, nebula-sync copies the settings from pihole1 to pihole2.
    # Static IPs (set in the container, DNS in Pi-hole).
    pihole1:
      # 192.168.1.99, CT 117
      ansible_host: debian-pihole1.lan
    pihole2:
      # 192.168.1.59, CT 105
      ansible_host: debian-pihole2.lan
    # Two connectors of the same Cloudflare Tunnel, one per node, see docs/cloudflared.md.
    # Static IPs (set in the container, DNS in Pi-hole), Nextcloud trusts both as proxies.
    cloudflared1:
      # 192.168.1.75 on proxmox-n01, formerly debian-cloudflared
      ansible_host: debian-cloudflared1.lan
    cloudflared2:
      # 192.168.1.72 on proxmox-n02
      ansible_host: debian-cloudflared2.lan
    glance:
      ansible_host: debian-glance.lan
      # Glance config (private repo, read via deploy key, see docs/glance.md).
      # SSH over port 443 like the website repo.
      glance_repo: ssh://git@ssh.github.com:443/gatogatogato/glance.git
      glance_dir: /home/gato/glance
      # Read by the glance service (--config /opt/glance_data/glance.yml), owned by root
      glance_data: /opt/glance_data
    npm:
      ansible_host: debian-npm.lan
    camsnaps:
      ansible_host: debian-camsnaps.lan
      # Gallery of Home Assistant's camera snapshots (private repo, read via deploy key,
      # see docs/camsnaps.md). SSH over port 443 like the website repo.
      camsnaps_repo: ssh://git@ssh.github.com:443/gatogatogato/camsnaps.git
      camsnaps_dir: /opt/camsnaps
      # Pictures, thumbnails and index.html, served by Apache as /snapshots/
      camsnaps_web: /var/www/html/snapshots
      # Home of the user camsnaps, holds the SSH key for Home Assistant
      camsnaps_home: /var/lib/camsnaps
      camsnaps_ha_host: root@homeassistant.lan
    mbusmaster:
      ansible_host: debian-mbusmaster.lan
    inventar:
      # static IP 192.168.1.66 on proxmox-n01 (CT 107), see docs/inventar.md
      ansible_host: debian-inventar.lan
      # Collector for the homelab inventory (private repo, read via deploy key).
      # SSH over port 443 like the website repo.
      inventar_repo: ssh://git@ssh.github.com:443/gatogatogato/inventar.git
      inventar_dir: /home/gato/Apps/inventar
      # Read-only credentials for UniFi, Pi-hole, NPM, Proxmox; only here, never in git
      inventar_secrets: /etc/inventar/secrets.env
      # Copy on debian-ansible (run.sh inventar-secrets-backup), only transport can read it
      inventar_secrets_backup: /home/transport/.config/inventar-secrets/secrets.env
      # Database and notes.yaml export, written by the collector and the web page (gato only)
      inventar_data: /var/lib/inventar
      # Web page, later behind NPM as https://inventar.mythenstrasse56.net
      inventar_web_port: 8080

cloudflared:
  vars:
    # Copy of the tunnel token on debian-ansible (run.sh cloudflared-token-backup), never in git
    cloudflared_token_backup: /home/transport/.config/cloudflared-secrets/token
    # Health endpoint for Uptime Kuma: http://<host>:2000/ready answers 200 while connected
    cloudflared_metrics_port: 2000
  hosts:
    cloudflared1:
    cloudflared2:

alpineservers:
  vars:
    timezone: Europe/Zurich
    # Includes the vaultwarden backup (cronjobs_alpineservers.yaml)
    periodic_daily_time: "00:30"
  hosts:
    # Runs Alpine Linux, DNS name kept for historical reasons
    vaultwarden:
      ansible_host: debian-vaultwarden.lan
      restart_after_upgrade:
        - vaultwarden
