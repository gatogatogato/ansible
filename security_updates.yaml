---
# Daily security updates for the hosts that see traffic from the internet
# (group security_daily in inventory.yaml). Debian: unattended-upgrades with
# the Debian-Security repo only (plus security_updates_extra_sites), then
# needrestart restarts the services that still use replaced libraries.
# Alpine: apk upgrade. Never reboots, one host at a time, so the tunnel keeps
# one connector. Runs daily from cron-run.sh, which reports to Uptime Kuma.
# Unreachable hosts fail on purpose. See docs/sicherheitsupdates.md.
- hosts: security_daily:&debianservers
  gather_facts: false
  become: true
  serial: 1
  name: "Debian: security updates, one host at a time"
  tasks:
    - name: "Record health before the upgrade"
      ansible.builtin.import_tasks: tasks/health_snapshot.yaml

    - name: "Install unattended-upgrades and needrestart"
      ansible.builtin.apt:
        name:
          - unattended-upgrades
          - needrestart
        update_cache: true
        cache_valid_time: 3600

    - name: "Allow only security updates"
      ansible.builtin.template:
        src: templates/50unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        mode: "0644"

    # debian-ansible runs it, so the apt timer neither duplicates the run nor
    # holds the apt lock while Sunday's run.sh updates works
    - name: "Switch off the apt timer run"
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          // Managed by Ansible: debian-ansible runs unattended-upgrade (run.sh security-updates)
          APT::Periodic::Update-Package-Lists "0";
          APT::Periodic::Unattended-Upgrade "0";
        mode: "0644"

    # needrestart hooks into apt; there it only lists, the restart below is one host at a time
    - name: "needrestart: only list services after apt runs"
      ansible.builtin.copy:
        dest: /etc/needrestart/conf.d/ansible.conf
        content: |
          # Managed by Ansible: services are restarted by run.sh security-updates
          $nrconf{restart} = 'l';
        mode: "0644"

    - name: "Refresh the package lists"
      ansible.builtin.apt:
        update_cache: true
      changed_when: false

    - name: "Install security updates"
      ansible.builtin.command: unattended-upgrade -v
      # English messages for the checks below
      environment:
        LC_ALL: C.UTF-8
      register: upgrade
      changed_when: "'All upgrades installed' in upgrade.stdout"
      failed_when: >-
        upgrade.rc != 0
        or 'Installing the upgrades failed' in upgrade.stdout + upgrade.stderr

    - name: "Show the installed packages"
      ansible.builtin.debug:
        msg: "{{ upgrade.stdout_lines | select('search', 'Packages that will be upgraded') | list }}"
      when: upgrade is changed

    # Also catches libraries from Sunday's run whose services were not restarted
    - name: "Find services that still use old libraries"
      ansible.builtin.command: needrestart -b -l
      register: needrestart_list
      changed_when: false

    # Plain text UI: the default debconf UI can fail without a terminal (rc 128)
    - name: "Restart them"
      ansible.builtin.command: needrestart -r a -l
      environment:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_UI: NeedRestart::UI::stdio
      when: needrestart_list.stdout is search('NEEDRESTART-SVC')

    - name: "Show the restarted services"
      ansible.builtin.debug:
        msg: "{{ needrestart_list.stdout_lines | select('search', 'NEEDRESTART-SVC') | map('regex_replace', '^NEEDRESTART-SVC: ', '') | list }}"
      when: needrestart_list.stdout is search('NEEDRESTART-SVC')

    - name: "Wait until the connector is connected to Cloudflare again"
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:{{ cloudflared_metrics_port }}/ready"
      register: ready
      until: ready.status == 200
      retries: 12
      delay: 5
      delegate_to: localhost
      become: false
      when: "'cloudflared' in group_names"

    - name: "Check health after the upgrade"
      ansible.builtin.import_tasks: tasks/health_check.yaml

    - name: "Check whether a reboot is waiting"
      ansible.builtin.stat:
        path: /run/reboot-required
      register: reboot_required

    - name: "Note a waiting reboot (Sunday's run.sh updates does it)"
      ansible.builtin.debug:
        msg: "Reboot waiting on {{ inventory_hostname }}, done by Sunday's run.sh updates"
      when: reboot_required.stat.exists

- hosts: security_daily:&alpineservers
  gather_facts: false
  become: true
  serial: 1
  name: "Alpine: daily apk upgrade"
  tasks:
    # Alpine's stable branches only get fixes, so this is security updates too
    - name: "Update apk index and upgrade all packages"
      community.general.apk:
        update_cache: true
        upgrade: true
      register: apk_upgrade

    - name: "Restart services after package upgrades"
      ansible.builtin.service:
        name: "{{ item }}"
        state: restarted
      loop: "{{ restart_after_upgrade | default([]) }}"
      when: apk_upgrade is changed

    - name: "Make sure the services run"
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
      loop: "{{ restart_after_upgrade | default([]) }}"
