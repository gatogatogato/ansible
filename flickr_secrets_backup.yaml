---
# Copy the flickr server's secrets to debian-ansible ({{ flickr_secrets_dir }},
# only transport can read it), so a new flickr server gets them back with
# run.sh flickr-server. Run again after a token changed.
# See "Keys und Tokens" in docs/flickr-server.md.
- hosts: flickr
  gather_facts: no
  become: yes
  name: "flickr server: back up secrets to debian-ansible"
  tasks:
    - name: "Create the backup folder on debian-ansible"
      ansible.builtin.file:
        path: "{{ flickr_secrets_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: no

    - name: "Check the secrets on the server"
      ansible.builtin.stat:
        path: "{{ item.dest }}"
      loop: "{{ flickr_secrets }}"
      register: on_server

    - name: "Fetch the secrets"
      ansible.builtin.fetch:
        src: "{{ item.0.dest }}"
        dest: "{{ flickr_secrets_dir }}/{{ item.0.name }}"
        flat: yes
      loop: "{{ flickr_secrets | zip(on_server.results) | list }}"
      loop_control:
        label: "{{ item.0.dest }}"
      when: item.1.stat.exists

    - name: "Make the copies readable only by transport"
      ansible.builtin.file:
        path: "{{ flickr_secrets_dir }}/{{ item.name }}"
        mode: "0600"
      loop: "{{ flickr_secrets }}"
      delegate_to: localhost
      become: no
      failed_when: false

    - name: "Report secrets missing on the server"
      ansible.builtin.debug:
        msg: "Not on the server, not backed up: {{ item.0.dest }}"
      loop: "{{ flickr_secrets | zip(on_server.results) | list }}"
      loop_control:
        label: "{{ item.0.dest }}"
      when: not item.1.stat.exists
