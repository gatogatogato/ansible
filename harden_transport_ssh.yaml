---
# Allow the transport key only from the ansible server (from= in authorized_keys).
# A stolen key is then useless from any other machine.
# Also removes the rule that let gato become transport (and so root) without a password.
# If a host locks us out: fix /home/transport/.ssh/authorized_keys via pct enter/exec.
- import_playbook: find_reachable.yaml
  vars:
    target_group: all

- hosts: reachable_all
  gather_facts: no
  become: yes
  name: "SSH: allow the transport key only from the ansible server"
  vars:
    # controller_ips is set in inventory.yaml
    transport_pubkey: "{{ lookup('file', lookup('env', 'HOME') + '/.ssh/id_ed25519.pub') }}"
  tasks:
    # If a host sees us under another address (e.g. IPv6), from= would lock us out
    - name: "Check that the host sees the ansible server under an allowed address"
      ansible.builtin.shell: echo "${SSH_CONNECTION%% *}"
      become: no
      register: ssh_source
      changed_when: false

    - name: "Stop if the connection comes from another address"
      ansible.builtin.assert:
        that: ssh_source.stdout in controller_ips
        fail_msg: "{{ inventory_hostname }} sees the ansible server as {{ ssh_source.stdout }}, not {{ controller_ips | join(' or ') }}. Not changing anything here."
        quiet: true

    - name: "Restrict the transport key to the ansible server"
      ansible.posix.authorized_key:
        user: transport
        key: "{{ transport_pubkey }}"
        key_options: "from=\"{{ controller_ips | join(',') }}\""

    # gato keeps sudo via the sudo group, but with gato's own password. Only remove the
    # rule where gato has a password, otherwise gato could not become root at all.
    - name: "Check whether gato has a password"
      ansible.builtin.shell: "getent shadow gato | cut -d: -f2"
      register: gato_password
      changed_when: false

    - name: "Remove password-free su to transport for gato"
      ansible.builtin.file:
        path: /etc/sudoers.d/gato
        state: absent
      when: gato_password.stdout.startswith('$')

    - name: "Warn where gato has no password"
      ansible.builtin.debug:
        msg: "gato has no password on {{ inventory_hostname }}, kept /etc/sudoers.d/gato. Set one with passwd gato and run again."
      # changed, so the compact output shows it
      changed_when: true
      when: gato_password.stdout | length > 0 and not gato_password.stdout.startswith('$')
