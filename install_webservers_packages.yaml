---
- hosts: websrv
  gather_facts: yes
  become: yes
  name: "Install stuff on web servers"
  tasks:
    - name: "Install a list of apt packages"
      ansible.builtin.apt:
        pkg:
        - apache2
        # keeps vpn.mythenstrasse56.net at Cloudflare up to date (DynDNS for the VPN),
        # /etc/ddclient.conf holds the API token and is not in this repo
        - ddclient
        - hugo
        - rsync
        - micro
        - git
        # lets Ansible run tasks as gato (become_user) on websrv
        - acl

    # The Cloudflare Tunnel does HTTPS and reaches websrv via plain HTTP, so
    # certbot (snap) and snapd are no longer needed
    - name: "Remove the certbot symlink"
      ansible.builtin.file:
        path: /usr/bin/certbot
        state: absent

    - name: "Remove snapd together with the certbot snap"
      ansible.builtin.apt:
        pkg:
        - snapd
        state: absent
        purge: true
        autoremove: true

    - name: "Enable the apache2 module rewrite"
      community.general.apache2_module:
        state: present
        name: rewrite

    - name: "Enable the apache2 module ssl"
      community.general.apache2_module:
        state: present
        name: ssl
