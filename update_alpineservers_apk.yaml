---
- hosts: alpineservers
  gather_facts: true
  become: true
  name: "Alpine: apk upgrade"
  tasks:
    - name: "Update apk index and upgrade all packages"
      community.general.apk:
        update_cache: true
        upgrade: true
      register: apk_upgrade

    - name: "Restart services after package upgrades"
      ansible.builtin.service:
        name: "{{ item }}"
        state: restarted
      loop: "{{ restart_after_upgrade | default([]) }}"
      when: apk_upgrade is changed
