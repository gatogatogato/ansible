---
- hosts: all
  gather_facts: yes
  become: yes
  name: "Set basic stuff on a new server"
  tasks:
    # A login shell that does not exist locks transport out of SSH
    - name: "Check that zsh is installed"
      ansible.builtin.stat:
        path: /bin/zsh
      register: zsh_binary

    - name: "Stop if zsh is missing"
      ansible.builtin.assert:
        that: zsh_binary.stat.exists
        fail_msg: "/bin/zsh is missing on {{ inventory_hostname }}, not changing any login shell. Run install_all_packages first."
        quiet: true

    - name: "Set shell for user transport and add to sudo group"
      ansible.builtin.user:
        name: transport
        shell: /bin/zsh
        groups: sudo
        append: yes

    - name: "Set shell for user gato and add to sudo group"
      ansible.builtin.user:
        name: gato
        shell: /bin/zsh
        groups: sudo
        append: yes

    - name: "Set shell for user root"
      ansible.builtin.user:
        name: root
        shell: /bin/bash

    - name: "Set micro as the editor of choice"
      community.general.alternatives:
        name: editor
        path: /usr/bin/micro
