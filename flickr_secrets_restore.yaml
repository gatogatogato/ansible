---
# Put the flickr server's secrets back from the copy on debian-ansible
# ({{ flickr_secrets_dir }}, made by run.sh flickr-secrets-backup). Only files
# missing on the server are copied, existing ones are never overwritten.
# See "Keys und Tokens" in docs/flickr-server.md.
- hosts: flickr
  gather_facts: false
  become: true
  name: "flickr server: restore secrets"
  tasks:
    - name: "Check the secrets on the server"
      ansible.builtin.stat:
        path: "{{ item.dest }}"
      loop: "{{ flickr_secrets }}"
      register: on_server

    - name: "Check the backup on debian-ansible"
      ansible.builtin.stat:
        path: "{{ flickr_secrets_dir }}/{{ item.name }}"
      loop: "{{ flickr_secrets }}"
      register: in_backup
      delegate_to: localhost
      become: false

    - name: "Create the secret folders"
      ansible.builtin.file:
        path: "{{ item.dest | dirname }}"
        state: directory
        owner: gato
        group: gato
        mode: "0700"
      loop: "{{ flickr_secrets }}"
      when: item.dest | dirname != '/home/gato'

    - name: "Copy missing secrets from the backup"
      ansible.builtin.copy:
        src: "{{ flickr_secrets_dir }}/{{ item.0.name }}"
        dest: "{{ item.0.dest }}"
        owner: gato
        group: gato
        mode: "0600"
      loop: "{{ flickr_secrets | zip(on_server.results, in_backup.results) | list }}"
      loop_control:
        label: "{{ item.0.dest }}"
      when: not item.1.stat.exists and item.2.stat.exists

    - name: "Stop when a secret is neither on the server nor in the backup"
      ansible.builtin.fail:
        msg: |
          Missing on the server and not in {{ flickr_secrets_dir }} on debian-ansible:
          {% for s in missing %}
            {{ s.dest }} ({{ s.what }})
          {% endfor %}
          Create them by hand, see "Keys und Tokens" in docs/flickr-server.md.
      vars:
        missing: "{{ flickr_secrets | zip(on_server.results, in_backup.results) | selectattr('1.stat.exists', 'false') | selectattr('2.stat.exists', 'false') | map(attribute='0') | list }}"
      when: missing | length > 0
