---
- hosts: debianservers
  gather_facts: true
  become: true
  name: "Create basic files on a new server"
  tasks:
    - name: "Create sudoers file for transport"
      become: true
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/transport"
        content: |
          transport ALL=(ALL:ALL) NOPASSWD:ALL
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: "Delete /etc/motd"
      ansible.builtin.file:
        path: /etc/motd
        state: absent

    - name: "Find files in /etc/update-motd.d/"
      ansible.builtin.find:
        paths: /etc/update-motd.d/
        patterns: "*"
      register: files_to_delete

    - name: "Delete files in /etc/update-motd.d/"
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      with_items: "{{ files_to_delete.files }}"

    - name: "Create motd uname"
      become: true
      ansible.builtin.copy:
        dest: "/etc/update-motd.d/10-uname"
        content: |
          #!/bin/sh
          uname -snvr

    - name: "Create motd gato"
      become: true
      ansible.builtin.copy:
        dest: "/etc/update-motd.d/20-gato"
        content: |
          #!/bin/sh
          banner $(hostname | awk 'BEGIN { FS = "-" } ; { print $2 }')

    - name: "Set permissions for uname"
      ansible.builtin.file:
        path: "/etc/update-motd.d/10-uname"
        state: touch
        mode: u=rwx,g=rx,o=rx

    - name: "Set permissions for gato"
      ansible.builtin.file:
        path: "/etc/update-motd.d/20-gato"
        state: touch
        mode: u=rwx,g=rx,o=rx

# This is only for the one glance server
- hosts: glance
  gather_facts: true
  become: true
  name: "Create glance specific motd script"
  tasks:
    - name: "Login message: how to edit the glance config"
      ansible.builtin.template:
        src: templates/motd-box.sh.j2
        dest: /etc/update-motd.d/30-glance
        owner: root
        group: root
        mode: "0755"
      vars:
        motd_lines:
          - "glance config: edit.sh"
          - "then on the Mac in the glance repo: ./pull.sh,"
          - "commit and push (see README)"

# This is only for the ansible server
- hosts: ansible
  gather_facts: false
  become: true
  name: "Create ansible server specific motd script"
  tasks:
    - name: "Login message: run Ansible as transport"
      ansible.builtin.template:
        src: templates/motd-box.sh.j2
        dest: /etc/update-motd.d/30-ansible
        owner: root
        group: root
        mode: "0755"
      vars:
        motd_lines:
          - "All ansible actions must run as user transport!"
          - "(sudo -iu transport, then clone.sh and run.sh TASK)"

    # Wrappers, not symlinks: run.sh finds the repo via its own path
    - name: "clone.sh and run.sh without a path"
      ansible.builtin.copy:
        dest: "/usr/local/bin/{{ item.name }}"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          exec {{ item.target }} "$@"
      loop:
        - { name: clone.sh, target: /home/transport/clone.sh }
        - { name: run.sh, target: /home/transport/ansible/run.sh }
