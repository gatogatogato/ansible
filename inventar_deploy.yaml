---
# Pull the current state of the inventar repo on debian-inventar, reinstall it
# into its venv (new dependencies) and restart the web page. The collector timer
# picks up the new code on its next run. See docs/inventar.md.
- hosts: inventar
  gather_facts: false
  become: true
  name: "inventar: deploy"
  tasks:
    - name: "Pull from GitHub (fast-forward only)"
      ansible.builtin.git:
        repo: "{{ inventar_repo }}"
        dest: "{{ inventar_dir }}"
        key_file: /home/gato/.ssh/inventar_deploy_key
        ssh_opts: "-o ConnectTimeout=15"
        update: true
      become_user: gato
      register: pulled

    - name: "Show the commit"
      ansible.builtin.debug:
        msg: "{{ pulled.before[:7] if pulled.before else '-' }} -> {{ pulled.after[:7] }}"

    - name: "Install the collector into its venv"
      ansible.builtin.pip:
        name: "{{ inventar_dir }}"
        editable: true
        virtualenv: "{{ inventar_dir }}/.venv"
        virtualenv_command: python3 -m venv
      become_user: gato
      when: pulled.changed

    - name: "Restart the web page"
      ansible.builtin.systemd_service:
        name: inventar-web
        state: restarted
      when: pulled.changed
